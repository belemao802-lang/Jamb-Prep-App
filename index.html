<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
svg{display:block;flex:none}

.tabs{display:flex;border-top:1px solid var(--bd);background:var(--card)}

.tabs button.on{color:var(--pri)}
.row{display:flex;align-items:center;gap:12px}.between{display:flex;justify-content:space-between;align-items:center}

.av{width:44px;height:44px;border-radius:50%;background:var(--pri);display:grid;place-items:center;color:#fff;flex:none}
.ai{background:linear-gradient(135deg,#4F6BFF,#8B5CF6);font-weight:800}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:20px}
.hero h2{font-size:22px;line-height:1.3}.hero p{color:#C9D2FF;font-size:13px;margin:6px 0 14px}
.btn{border:0;color:#fff;font:700 14px system-ui,sans-serif;padding:12px 22px;border-radius:18px;background:linear-gradient(90deg,#4F6BFF,#8B5CF6);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;text-align:left;border-radius:18px;padding:14px;min-height:112px;color:var(--text);font-family:inherit}

.card{background:var(--card);border-radius:16px;padding:14px}

.res .ic{margin:0 auto 6px}
.topic{display:flex;align-items:center;gap:12px}.topic .ic{margin:0}.topic b{display:block;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:16px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}.stat strong{display:block;font-size:24px}
.chat{flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto}

.sc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:16px;color:var(--text);font-family:inherit}
.sc .ic{width:52px;height:52px;border-radius:50%;margin:0}
.sc b{display:block;font-size:16px;margin-bottom:3px}
.lnk{background:none;border:0;color:var(--pri);font:600 13px system-ui,sans-serif}

.fld{display:flex;flex-direction:column;gap:6px}.fld label{font-size:13px;font-weight:600}

.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:600 14px system-ui,sans-serif;padding:10px;border-radius:10px}

.err{color:var(--bad);font-size:13px;min-height:18px}
.fld input.otp{letter-spacing:10px;text-align:center;font-size:24px;font-weight:700}
.empty{background:var(--card);border-radius:16px;padding:16px;text-align:center}
.offbar{display:none;position:fixed;top:0;left:0;right:0;z-index:20;background:#F59E0B;color:#1a1a1a;text-align:center;font-size:12px;font-weight:600;padding:4px 8px;padding-top:calc(4px + env(safe-area-inset-top,0px))}
</style>
</head>

function quiz(){
 var o=document.getElementById('over');
 if(qi>=Q.length){o.innerHTML='<div class="ov quiz" style="align-items:center;justify-content:center"><div style="font-size:56px;font-weight:800">'+score+'/'+Q.length+'</div><div style="color:#C9D2FF">'+Math.round(score/Q.length*100)+'% correct</div><div class="qc" style="width:100%;max-width:420px;margin-top:16px"><b>Session summary</b><p style="margin-top:8px">Correct: '+score+'</p><p style="margin-top:4px">Incorrect: '+(Q.length-score)+'</p><p style="margin-top:4px">Total questions attempted across all sessions: '+ST.total+'</p></div><div style="color:#C9D2FF">Nice work, Champion!</div><button class="btn" style="margin-top:24px" onclick="closeOv()">Back to Home</button></div>';return}
 var x=Q[qi];
 o.innerHTML='<div class="ov quiz"><div class="row"><button onclick="closeOv()" aria-label="Close" style="background:none;border:0;color:#fff">'+I('x',22)+'</button><b style="flex:1">'+(Q[qi]._subject||sub)+'</b><button onclick="toggleBookmark()" aria-label="Bookmark question" style="background:none;border:0;color:'+(BOOKMARKS.some(function(b){return b.key===((Q[qi]._subject||sub)+'|'+Q[qi].q)})?'#FBBF24':'#fff')+';font-size:20px">★</button><span style="color:#C9D2FF">'+(qi+1)+'/'+Q.length+'</span></div>'+
 '<div style="height:5px;border-radius:3px;background:#1E2A5E"><div style="height:5px;border-radius:3px;background:#38BDF8;width:'+((qi+1)/Q.length*100)+'%"></div></div>'+
 '<div class="qc"><span class="chip">Multiple Choice</span><p style="font-size:18px;font-weight:700;line-height:1.4;margin-top:12px">'+esc(x.q)+'</p>'+(picked===null?'':'<p style="margin-top:12px;color:'+(picked===x.a?'#86EFAC':'#FCA5A5')+';font-size:13px;font-weight:600">'+(picked===x.a?'Correct!':'Not quite. Correct answer: '+esc(x.o[x.a]))+'</p>'+(x.explanation?'<p style="margin-top:10px;color:#DCE4FF;font-size:14px;line-height:1.5"><b>Explanation:</b> '+esc(x.explanation)+'</p>':''))+'</div>'+
 x.o.map(function(t,n){var cl=picked===null?'':(n===x.a?' ok':(picked===n?' no':''));return '<button class="opt'+cl+'" onclick="pick('+n+')"><i>'+'ABCD'[n]+'</i><span style="flex:1">'+esc(t)+'</span>'+(cl===' ok'?I('check',22,'#22C55E'):cl===' no'?I('xc',22,'#EF4444'):'')+'</button>'}).join('')+
 '<div style="flex:1"></div><button class="btn" style="padding:16px;font-size:16px;opacity:'+(picked===null?.5:1)+'" '+(picked===null?'disabled':'')+' onclick="nextQ()">'+(qi===Q.length-1?'Finish':'Next')+'</button></div>'}

function tour(){
 var s=STEPS[ti],last=ti===STEPS.length-1;
 document.getElementById('over').innerHTML='<div class="ov tour"><div class="tc"><div class="row"><div class="av ai">AI</div><h2 style="flex:1">'+s[0]+'</h2></div>'+
 '<p class="muted" style="font-size:15px;line-height:1.5;margin-top:12px">'+s[1]+'</p><div class="dots">'+STEPS.map(function(_,n){return '<i class="'+(n===ti?'on':'')+'"></i>'}).join('')+'</div>'+
 '<div class="between">'+(last?'<span></span>':'<button onclick="endTour()" style="background:none;border:0;color:var(--muted);font-weight:600;font-size:14px">Skip</button>')+
 '<button class="btn" onclick="'+(last?'endTour()':'ti++;tour()')+'">'+(last?'Let’s go':'Next')+'</button></div></div></div>'}

function welcome(){document.getElementById('over').innerHTML='<div class="ov wel"><div style="margin-bottom:8px">'+LOGO(104)+'</div><div style="font-size:20px">Welcome to</div><h1 style="font-size:36px">Jamb Prep App</h1><p style="color:#C9D2FF;line-height:1.5;max-width:300px">Your all-in-one JAMB study companion. Prep smarter, ace higher!</p><button class="btn" style="width:100%;padding:16px;font-size:16px;margin-top:30px" onclick="D.login=false;streams()">Get Started</button><button onclick="loginStart()" style="background:none;border:0;color:#9DB0FF;font-weight:600;font-size:14px;padding:8px">I already have an account</button></div>'}

function streams(){
 document.getElementById('over').innerHTML='<div class="ov light"><button class="back" onclick="'+(first?'welcome()':'closeOv()')+'" aria-label="Back">'+I('back',24)+'</button>'+
 '<div><h1 style="font-size:26px">Select Your Stream</h1><p class="muted" style="margin-top:6px;font-size:14px">Choose your preferred JAMB stream to get relevant subjects and study plans.</p></div>'+
 Object.keys(STREAMS).map(function(k){var x=STREAMS[k];return '<button class="sc" style="background:'+A(x.c,.1)+'" onclick="pickStream(\''+k+'\')">'+box(x.ic,x.c,24)+'<div style="flex:1"><b>'+x.n+'</b><span class="muted">'+x.d+'</span></div><span style="color:'+x.c+'">'+I('chev',20)+'</span></button>'}).join('')+'</div>'}

function subjectChoices(){return [['Use of English','English Language (compulsory)'],['Mathematics','Mathematics'],['Physics','Physics'],['Chemistry','Chemistry'],['Biology','Biology'],['Economics','Economics'],['Government','Government'],['Literature in English','Literature in English']]}
function preferences(){
 var opts=subjectChoices();
 document.getElementById('over').innerHTML='<div class="ov light"><button class="back" onclick="streams()" aria-label="Back">'+I('back',24)+'</button><div><h1 style="font-size:26px">Your study plan</h1><p class="muted" style="margin-top:6px;font-size:14px">Choose your four JAMB subjects and personalise your preparation.</p></div><div class="card"><h2 style="margin-bottom:12px">Your four subjects</h2>'+opts.map(function(x){var checked=PREFS.subjects.indexOf(x[0])>=0;return '<label class="row" style="padding:8px 0;align-items:center;font-size:15px"><input type="checkbox" class="subpick" value="'+esc(x[0])+'" '+(x[0]==='Use of English'?'checked disabled':(checked?'checked':''))+' style="width:22px;height:22px;accent-color:var(--pri)"><span>'+x[1]+'</span></label>'}).join('')+'<p class="tiny" style="margin-top:8px">English Language is compulsory. Select three other subjects. Confirm your combination for your intended course in the official JAMB brochure.</p></div><div class="fld"><label for="prefname">Preferred name</label><input id="prefname" autocomplete="name" placeholder="What should we call you?" value="'+esc(PREFS.name||'')+'"></div><div class="fld"><label for="prefcourse">Intended course (optional)</label><input id="prefcourse" placeholder="e.g. Medicine" value="'+esc(PREFS.course||'')+'"></div><div class="fld"><label for="preftarget">Target score (out of 400)</label><input id="preftarget" type="number" min="1" max="400" value="'+Number(PREFS.target||250)+'"></div><div class="fld"><label for="prefstudy">Study time per day</label><select id="prefstudy" style="border:1px solid var(--bd);background:var(--card);color:var(--text);border-radius:14px;padding:14px 16px;font-size:16px;width:100%">'+['30 minutes','1 hour','2 hours','3 hours','4 hours or more'].map(function(v){return '<option '+(PREFS.studyTime===v?'selected':'')+'>'+v+'</option>'}).join('')+'</select></div><div class="fld"><label for="prefdate">Exam date (optional)</label><input id="prefdate" type="date" value="'+esc(PREFS.examDate||'')+'"></div><div class="err" id="preferr"></div><button class="btn" style="width:100%;padding:16px;font-size:16px" onclick="savePreferences()">Start preparing</button></div>'
}
function savePreferences(){
 var chosen=Array.from(document.querySelectorAll('.subpick:checked')).map(function(x){return x.value});
 if(chosen.length!==4){var e=document.getElementById('preferr');if(e)e.textContent='Please select English Language and exactly three other subjects.';return}
 var target=Number(document.getElementById('preftarget').value||250);if(!Number.isFinite(target)||target<1||target>400){var e=document.getElementById('preferr');if(e)e.textContent='Target score must be between 1 and 400.';return}
 PREFS={name:document.getElementById('prefname').value.trim(),course:document.getElementById('prefcourse').value.trim(),target:target,studyTime:document.getElementById('prefstudy').value,examDate:document.getElementById('prefdate').value,subjects:chosen};
 try{localStorage.setItem('jp_preferences',JSON.stringify(PREFS))}catch(e){}
 STREAMS[stream].s=chosen.slice();if(PREFS.name)D.name=PREFS.name;sub=chosen[0];if(!P){setup()}else{saveStream();closeOv()}
}
function pickStream(k){stream=k;sub=STREAMS[k].s[0];if(!P){preferences()}else if(first){ti=0;tour()}else{preferences()}}

function splash(){document.getElementById('over').innerHTML='<div class="ov spl">'+LOGO(120)+'<div class="wm">Jamb <span>Prep App</span></div><p style="color:#C9D2FF;line-height:1.7;margin-top:8px">Learn Smarter.<br>Score Higher.<br>Build Your Future.</p><div class="ld"><i></i></div></div>';setTimeout(welcome,2200)}

var D={m:'email',name:'',val:'',login:false},T=null;
function friendly(m){if(/rate limit|seconds|too many/i.test(m))return 'Please wait a minute before asking for another code.';if(/signups not allowed|not found/i.test(m))return 'No account found for this email. Go back and create one.';if(/expired|invalid/i.test(m))return 'That code is wrong or has expired. Request a new one.';return m}
function loginStart(){D={m:'email',name:'',val:'',login:true};setup()}
function grab(){var n=document.getElementById('nm'),v=document.getElementById('cv');if(n)D.name=n.value;if(v)D.val=v.value}
function setM(m){grab();D.m=m;setup()}
function setup(err){
 var em=D.m==='email';
 document.getElementById('over').innerHTML='<div class="ov light"><button class="back" onclick="'+(D.login?'welcome()':'streams()')+'" aria-label="Back">'+I('back',24)+'</button>'+
 '<div><h1 style="font-size:26px">'+(D.login?'Welcome back':'Create Your Profile')+'</h1><p class="muted" style="margin-top:6px;font-size:14px">'+(D.login?'Enter your email and we’ll send you a code.':'Tell us who you are, then verify your email.')+'</p></div>'+
 (D.login?'':'<div class="fld"><label for="nm">Full name</label><input id="nm" autocomplete="name" placeholder="e.g. Ada Okafor" value="'+esc(D.name||PREFS.name||'')+'"></div>')+
 '<div class="seg"><button class="'+(em?'on':'')+'" onclick="setM(\'email\')">Email</button><button class="'+(em?'':'on')+'" onclick="setM(\'phone\')">Phone number</button></div>'+
 (em?'<div class="fld"><label for="cv">Email address</label><input id="cv" type="email" inputmode="email" autocomplete="email" autocapitalize="none" placeholder="you@example.com" value="'+esc(D.val)+'"></div>':'<div class="card muted" style="font-size:13px">Phone verification is coming soon. It needs a text-message service to be set up. Please use your email for now.</div>')+
 '<div class="err" id="er">'+(err||'')+'</div><button class="btn" id="sb" style="padding:16px;font-size:16px;'+(em?'':'opacity:.5')+'" '+(em?'':'disabled')+' onclick="sendCode()">Send verification code</button></div>'}
function sendCode(){grab();var v=D.val.trim().toLowerCase(),n=D.name.trim();
 if(D.m!=='email')return;
 if(!sb||!navigator.onLine)return setup('You need an internet connection to sign in.');
 if(!D.login&&n.length<2)return setup('Please enter your name.');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))return setup('Enter a valid email address.');
 D.val=v;var b=document.getElementById('sb');if(b){b.disabled=true;b.textContent='Sending…'}
 sb.auth.signInWithOtp({email:v,options:{shouldCreateUser:!D.login,data:{full_name:n,stream:stream}}}).then(function(r){
  if(r.error)return setup(friendly(r.error.message));
  verify()}).catch(function(){setup('Could not reach the server. Check your internet and try again.')})}
function mask(){var p=D.val.split('@');return p[0].charAt(0)+'***@'+p[1]}
function verify(err){clearInterval(T);var left=60;
 document.getElementById('over').innerHTML='<div class="ov light"><button class="back" onclick="setup()" aria-label="Back">'+I('back',24)+'</button><div><h1 style="font-size:26px">Verify your email</h1><p class="muted" style="margin-top:6px;font-size:14px">Enter the code we sent to '+esc(mask())+'. Check your spam folder if you don’t see it.</p></div>'+
 '<div class="fld"><label for="otp">Verification code</label><input id="otp" class="otp" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="••••••"></div>'+
 '<div class="err" id="er">'+(err||'')+'</div><button class="btn" id="vb" style="padding:16px;font-size:16px" onclick="check()">Verify</button>'+
 '<div class="muted" style="text-align:center" id="rs">Resend code in 60s</div></div>';
 T=setInterval(function(){left--;var r=document.getElementById('rs');if(!r){clearInterval(T);return}if(left>0)r.textContent='Resend code in '+left+'s';else{clearInterval(T);r.innerHTML='<button class="lnk" onclick="sendCode()">Resend code</button>'}},1000)}
function check(){var c=document.getElementById('otp').value.replace(/\D/g,'');
 if(c.length<6)return verify('Enter the code from your email.');
 var b=document.getElementById('vb');if(b){b.disabled=true;b.textContent='Verifying…'}
 sb.auth.verifyOtp({email:D.val,token:c,type:'email'}).then(function(r){
  if(r.error||!r.data||!r.data.user)return verify(friendly(r.error?r.error.message:'Verification failed.'));
  clearInterval(T);uid=r.data.user.id;var oc=readCache();if(oc&&oc.uid!==uid){lsDel('jp_cache');lsDel('jp_dirty')}
  loadAll(function(ok){
   if(!ok)return verify('Signed in, but your profile could not load. Try again.');
   var seen=false;try{seen=localStorage.getItem('jp_tour')==='1'}catch(e){}
   first=!seen;if(first){ti=0;tour()}else{closeOv()}})
 }).catch(function(){verify('Could not reach the server. Check your internet and try again.')})}
function signOut(){
 var done=function(){uid=null;P=null;ST={streak:0,last:'',total:0,correct:0,sessions:0,goalDay:'',goalN:0,subj:{}};lsDel('jp_cache');lsDel('jp_dirty');first=true;tab='home';stream='Science';sub='Biology';D={m:'email',name:'',val:'',login:false};render();splash()};
 if(!sb){done();return}
 sb.auth.signOut().then(done).catch(done)}

document.getElementById('over').innerHTML='<div class="ov spl"></div>';
render();
function enterApp(){first=false;closeOv()}
function startOffline(){var c=readCache();if(c){applyCache(c);enterApp()}else splash()}
function startOnline(ss){
 uid=ss.user.id;var c=readCache();
 if(c&&c.uid===uid){
  applyCache(c);enterApp();
  var refresh=function(){loadAll(function(ok){if(ok)render()})};
  if(lsGet('jp_dirty')==='1')pushAll().then(refresh);else refresh();
 }else loadAll(function(ok){if(ok)enterApp();else splash()})}
if(!sb){startOffline()}else sb.auth.getSession().then(function(r){
 var ss=r.data&&r.data.session;
 if(ss)startOnline(ss);else if(!navigator.onLine)startOffline();else{lsDel('jp_cache');splash()}
}).catch(startOffline);

function offBar(){var b=document.getElementById('offbar');if(b)b.style.display=navigator.onLine?'none':'block'}
window.addEventListener('online',function(){offBar();if(lsGet('jp_dirty')==='1')pushAll()});
window.addEventListener('offline',offBar);
offBar();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
